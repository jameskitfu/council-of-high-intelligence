name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli

      - name: Shellcheck
        run: |
          shellcheck install.sh
          shellcheck scripts/detect-providers.sh
          shellcheck scripts/council-simulation-checklist.sh

      - name: Runtime and installation behavior
        run: ./scripts/council-simulation-checklist.sh

      - name: Markdownlint
        run: |
          markdownlint \
            --disable MD012 MD013 MD022 MD024 MD032 MD033 MD036 MD040 MD041 MD058 \
            README.md CONTRIBUTING.md CHANGELOG.md \
            SKILL.md SKILL.codex.md SKILL.gemini.md \
            "protocol/**/*.md" \
            "agents/**/*.md" \
            "demos/**/*.md"
